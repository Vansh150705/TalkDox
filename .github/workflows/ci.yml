name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      # LibreOffice powers the legacy .doc test; the test skips itself if it is missing.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: python -m pytest tests -q          # unit, integration, security, Gemini-protocol stub and offline RAG evaluation
      - name: Upload offline evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: offline-eval-report, path: backend/tests/eval/last_report.json, if-no-files-found: ignore }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    # Real browser against the real UI and API, using the offline demo backend (no API keys, no AI).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r backend/requirements-dev.txt
      - run: cd frontend && npm ci && npm install --no-save playwright@1.64.1 && npx playwright install --with-deps chromium
      - run: |
          (cd backend && python scripts/run_offline_demo.py &) 
          (cd frontend && npx vite --host 127.0.0.1 &)
          sleep 8
          cd frontend && node e2e/smoke.mjs http://127.0.0.1:5173
